vehicle:
  wheelbase: 2.8
  max_steer: 0.5236
  max_speed: 33.33
  max_accel: 2.0
  max_decel: 4.0
  mass: 1500.0
  front_stiffness: 150000.0
  rear_stiffness: 150000.0

communication:
  type: CAN
  can_interface: can0
  can_bitrate: 500000

controller:
  longitudinal:
    kp: 1.0
    ki: 0.1
    kd: 0.05
  lateral:
    type: Stanley
    k: 0.5
    k_soft: 1.0

planner:
  default: ASTAR
  astar:
    resolution: 0.5
    heuristic_weight: 1.0
  rrt:
    max_iterations: 5000
    step_size: 2.0
  smoother:
    enabled: true
    type: BSPLINE
    parameters:
      smoothing_factor: 0.5
      resolution: 0.2
      learning_rate: 0.1
      weight_data: 0.5
      weight_smooth: 0.5

perception:
  camera_fps: 30
  lidar_frequency: 10
  detector:
    type: YOLO
    yolo:
      model_path: "models/yolov5s.onnx"
      config_path: ""
      classes_path: "models/coco.names"
      confidence_threshold: 0.5
      nms_threshold: 0.45
      input_width: 640
      input_height: 640

localization:
  update_rate: 100
  gps_update_rate: 10
  imu_update_rate: 200