vehicle:
  wheelbase: 3.0
  max_steer: 0.4363
  max_speed: 50.0
  max_accel: 3.0
  max_decel: 5.0
  mass: 2000.0
  front_stiffness: 200000.0
  rear_stiffness: 200000.0

communication:
  type: Ethernet
  ethernet_ip: 192.168.0.100
  ethernet_port: 8080

controller:
  longitudinal:
    kp: 1.2
    ki: 0.15
    kd: 0.08
  lateral:
    type: MPC
    prediction_horizon: 10
    control_horizon: 3

planner:
  default: RRT_STAR
  astar:
    resolution: 1.0
    heuristic_weight: 1.0
  rrt_star:
    max_iterations: 8000
    step_size: 3.0
  smoother:
    enabled: true
    type: GRADIENT_DESCENT
    parameters:
      smoothing_factor: 0.6
      resolution: 0.3
      learning_rate: 0.15
      weight_data: 0.4
      weight_smooth: 0.6

perception:
  camera_fps: 25
  lidar_frequency: 20
  detector:
    type: PointPillars
    pointpillars:
      model_path: "models/pointpillars.onnx"
      confidence_threshold: 0.5
      nms_threshold: 0.5
      voxel_size_x: 0.16
      voxel_size_y: 0.16
      voxel_size_z: 0.4
      point_cloud_range_min_x: -51.2
      point_cloud_range_max_x: 51.2
      point_cloud_range_min_y: -51.2
      point_cloud_range_max_y: 51.2
      point_cloud_range_min_z: -3.0
      point_cloud_range_max_z: 1.0
      max_points_per_voxel: 32
      max_voxels: 40000

localization:
  update_rate: 200
  gps_update_rate: 20
  imu_update_rate: 400